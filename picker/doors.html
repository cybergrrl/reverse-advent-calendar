<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descriptions and Doors</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚪</text></svg>">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --star: #d4a017; --door: #b5302a; --stage: #3c5a48; --none: #8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --panel: #222126; --ink: #ecebe8; --muted: #a29d95; --line: #35333a; --none: #e0a84a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 19px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  header label { font-size: 14px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  header select, header input[type=search] { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  .doorcount { margin-left: auto; font-weight: 700; font-size: 16px; }
  .doorcount.full { color: var(--door); }
  .help { font-size: 13px; color: var(--muted); flex-basis: 100%; display: flex; gap: 16px; flex-wrap: wrap; }
  #status { color: var(--ink); }
  #tray { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; min-height: 76px; align-items: center; padding: 2px 0; }
  #tray .slot { flex: none; width: 86px; height: 92px; border-radius: 6px; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; cursor: pointer; }
  #tray .slot img { max-width: 70px; max-height: 66px; }
  #tray .slot span { font-size: 11px; color: #fff; max-width: 82px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tray .slot b { position: absolute; top: -2px; left: 2px; font-size: 11px; color: #fff; text-shadow: 0 1px 2px #000; }
  #tray .slot.empty { background: none; border: 1px dashed var(--line); cursor: default; }
  main { padding: 0 16px 24px; }
  h2 { font-size: 18px; margin: 22px 0 10px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 600px), 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: minmax(0, 300px) 1fr; gap: 10px; align-items: start; }
  .card.hasdoor { border-color: var(--door); box-shadow: 0 0 0 1px var(--door); }
  .card > img { width: 100%; max-height: 340px; object-fit: contain; border-radius: 4px; background: var(--line); cursor: zoom-in; }
  .card .words.ai { color: #b5302a; font-weight: 600; }
  #lightbox { position: fixed; inset: 0; z-index: 50; background: #000d; display: none; gap: 16px; padding: 16px; }
  #lightbox.open { display: flex; }
  #lightbox .pic { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #lightbox .pic img { max-width: 100%; max-height: calc(100vh - 32px); object-fit: contain; cursor: zoom-out; }
  #lightbox aside { width: min(420px, 38vw); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 14px 16px; overflow: auto; }
  #lightbox aside h3 { margin: 0 0 4px; font-size: 18px; }
  #lightbox aside .cap { color: var(--muted); font-size: 13.5px; }
  #lightbox aside .src { font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  #lightbox aside .src.ai { color: #b5302a; }
  #lightbox aside p { white-space: pre-line; font-size: 15px; line-height: 1.55; }
  #lightbox aside .nav { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); align-items: center; }
  #lightbox aside button { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; }
  @media (max-width: 800px) { #lightbox { flex-direction: column; } #lightbox aside { width: auto; max-height: 40vh; } }
  .card h3 { font-size: 15px; margin: 0; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card .cap { color: var(--muted); font-size: 12.5px; }
  .card .words { font-size: 12.5px; margin-top: 2px; }
  .card .words.none { color: var(--none); font-weight: 600; }
  details { margin-top: 4px; font-size: 13.5px; }
  details summary { cursor: pointer; color: var(--muted); }
  details p { margin: 6px 0; white-space: pre-line; }
  .stickers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .st { width: 136px; border: 2px solid transparent; border-radius: 6px; background: var(--stage); cursor: pointer; padding: 3px 3px 2px; position: relative; text-align: center; }
  .st img { width: 126px; height: 116px; object-fit: contain; display: block; margin: 0 auto; }
  .st span { display: block; font-size: 12.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st.star { border-color: var(--star); }
  .st .mark { position: absolute; top: 1px; left: 3px; color: var(--star); font-size: 13px; text-shadow: 0 1px 2px #000; }
  .st.door { border-color: var(--door); box-shadow: 0 0 0 2px var(--door); }
  .st .num { position: absolute; top: 1px; right: 3px; background: var(--door); color: #fff; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 0 5px; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Descriptions and doors</h1>
  <a href="/review">Back to review</a>
  <label>Show <select id="show">
    <option value="starred">paintings with a starred sticker</option>
    <option value="all">all paintings with stickers</option>
    <option value="doors">paintings with a door pick</option>
  </select></label>
  <label>Stickers <select id="which"><option value="all">all</option><option value="starred">starred only</option></select></label>
  <input type="search" id="q" placeholder="Search title or label">
  <span class="doorcount" id="doorcount"></span>
  <div class="help"><span>Click a sticker to pick it for a door, click again to remove it. Click a door in the tray to jump to its painting. Gold border: starred. Red: picked for a door.</span><span id="status"></span></div>
  <div id="tray"></div>
</header>
<main id="main"></main>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Painting">
  <div class="pic"><img id="lbImg" alt=""></div>
  <aside><div class="nav"><button id="lbPrev">← Previous</button><button id="lbNext">Next →</button><button id="lbClose">Close (Esc)</button></div>
    <h3 id="lbTitle"></h3><div class="cap" id="lbCap"></div><div class="src" id="lbSrc"></div><p id="lbText"></p></aside>
</div>
<script>
const $ = id => document.getElementById(id);
const DOORS = 25, PLACEHOLDER = "[No description yet]";
let data, doors = [];

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
const hasText = p => p.long && p.long !== PLACEHOLDER;
const itemsOf = id => data.items.filter(i => i.painting === id).sort((a, b) => b.star - a.star || a.label.localeCompare(b.label));
const byKey = key => data.items.find(i => i.key === key);

function cardHtml(p) {
  const which = $("which").value;
  const items = itemsOf(p.id).filter(i => which === "all" || i.star);
  const words = hasText(p) ? p.long.split(/\s+/).length : 0;
  const picked = items.some(i => doors.includes(i.key));
  return `<div class="card${picked ? " hasdoor" : ""}" id="p${p.id}">
    <img loading="lazy" src="/images1600/${p.id}.jpg" alt="${esc(p.title)}" data-open="${p.id}" title="Click to see it large">
    <div><h3><a href="${p.url}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
      <div class="cap">${esc(p.caption)}</div>
      <div class="words${!words ? " none" : p.text_source === "ai" ? " ai" : ""}">${!words ? "No description" : p.text_source === "ai" ? `AI-written description, ${words} words` : `AIC description, ${words} words`}</div>
      ${words ? `<details><summary>Read it</summary><p>${esc(p.long)}</p></details>` : ""}</div>
    <div class="stickers">${items.map(i => {
      const n = doors.indexOf(i.key);
      return `<div class="st${i.star ? " star" : ""}${n >= 0 ? " door" : ""}" data-key="${i.key}" title="${esc(i.detail)}">
        ${i.star ? `<span class="mark">★</span>` : ""}${n >= 0 ? `<span class="num">${n + 1}</span>` : ""}
        <img loading="lazy" src="/${i.sticker}" alt="${esc(i.label)}"><span>${esc(i.label)}</span></div>`;
    }).join("") || `<span class="empty">No starred stickers</span>`}</div>
  </div>`;
}

function render() {
  const show = $("show").value, q = $("q").value.trim().toLowerCase();
  const list = Object.values(data.paintings).filter(p => {
    const items = itemsOf(p.id);
    if (!items.length) return false;
    if (show === "starred" && !items.some(i => i.star)) return false;
    if (show === "doors" && !items.some(i => doors.includes(i.key))) return false;
    return !q || `${p.title} ${p.caption} ${items.map(i => `${i.label} ${i.detail}`).join(" ")}`.toLowerCase().includes(q);
  }).sort((a, b) => a.title.localeCompare(b.title));
  const withText = list.filter(hasText), without = list.filter(p => !hasText(p));
  $("main").innerHTML = `
    <h2>With an AIC description <small>${withText.length} paintings</small></h2>
    <div class="grid">${withText.map(cardHtml).join("") || `<p class="empty">None</p>`}</div>
    <h2>Without a description <small>${without.length} paintings</small></h2>
    <div class="grid">${without.map(cardHtml).join("") || `<p class="empty">None</p>`}</div>`;
  renderTray();
}

function renderTray() {
  const slots = [];
  for (let n = 0; n < Math.max(DOORS, doors.length); n++) {
    const i = doors[n] && byKey(doors[n]);
    slots.push(i ? `<div class="slot" data-key="${i.key}" title="${esc(i.label)}: ${esc(data.paintings[i.painting].title)}"><b>${n + 1}</b><img src="/${i.sticker}" alt="${esc(i.label)}"><span>${esc(i.label)}</span></div>`
      : `<div class="slot empty"></div>`);
  }
  $("tray").innerHTML = slots.join("");
  const paintings = new Set(doors.map(k => byKey(k)?.painting));
  const noText = doors.filter(k => byKey(k) && !hasText(data.paintings[byKey(k).painting])).length;
  $("doorcount").textContent = `${doors.length} of ${DOORS} doors` + (paintings.size < doors.length ? ` · ${doors.length - paintings.size} share a painting` : "")
    + (noText ? ` · ${noText} without description` : "");
  $("doorcount").classList.toggle("full", doors.length >= DOORS);
}

async function toggle(key) {
  const picked = !doors.includes(key);
  const r = await fetch("/api/doors", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key, picked }) });
  if (!r.ok) { $("status").textContent = "Save failed"; return; }
  doors = (await r.json()).doors;
  const i = byKey(key);
  $("status").textContent = `${picked ? "Picked" : "Removed"}: ${i.label} from ${data.paintings[i.painting].title}`;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

let lbList = [], lbAt = 0;
function showLightbox(id) {
  lbList = [...document.querySelectorAll("[data-open]")].map(el => el.dataset.open);
  lbAt = Math.max(0, lbList.indexOf(id));
  renderLightbox();
  $("lightbox").classList.add("open");
}
function renderLightbox() {
  const p = data.paintings[lbList[lbAt]];
  $("lbImg").src = `/images1600/${p.id}.jpg`; $("lbImg").alt = p.title;
  $("lbTitle").textContent = p.title; $("lbCap").textContent = p.caption;
  const text = hasText(p) ? p.long : "";
  $("lbSrc").textContent = !text ? "No description" : p.text_source === "ai" ? "AI-written description (draft)" : "From the Art Institute of Chicago";
  $("lbSrc").className = `src ${p.text_source === "ai" ? "ai" : ""}`;
  $("lbText").textContent = text;
  $("lbPrev").disabled = lbAt === 0; $("lbNext").disabled = lbAt === lbList.length - 1;
}
const closeLightbox = () => $("lightbox").classList.remove("open");
$("lbClose").addEventListener("click", closeLightbox);
$("lbImg").addEventListener("click", closeLightbox);
$("lbPrev").addEventListener("click", () => { if (lbAt > 0) { lbAt--; renderLightbox(); } });
$("lbNext").addEventListener("click", () => { if (lbAt < lbList.length - 1) { lbAt++; renderLightbox(); } });
document.addEventListener("keydown", e => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") $("lbPrev").click();
  if (e.key === "ArrowRight") $("lbNext").click();
});

$("main").addEventListener("click", e => {
  const pic = e.target.closest("[data-open]");
  if (pic) return showLightbox(pic.dataset.open);
  const st = e.target.closest(".st"); if (st) toggle(st.dataset.key);
});
$("tray").addEventListener("click", e => {
  const slot = e.target.closest(".slot[data-key]");
  if (!slot) return;
  const card = $(`p${byKey(slot.dataset.key).painting}`);
  if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
  else $("status").textContent = "That painting is hidden by the current filter";
});
["show", "which"].forEach(id => $(id).addEventListener("change", render));
$("q").addEventListener("input", render);

fetch("/api/doors").then(r => r.json()).then(d => { data = d; doors = d.doors; render(); });
</script>
</body>
</html>
