<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starred Items</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>★</text></svg>">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --festive: #d23b2a; --star: #d4a017; --tile: #2a2724; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --panel: #222126; --ink: #ecebe8; --muted: #a29d95; --line: #35333a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 19px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  header label { font-size: 14px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  header select, header input[type=search] { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  .count { margin-left: auto; font-size: 14px; color: var(--muted); }
  .help { font-size: 13px; color: var(--muted); flex-basis: 100%; display: flex; gap: 16px; flex-wrap: wrap; }
  #status { color: var(--ink); }
  #index { flex-basis: 100%; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; max-height: 64px; overflow: auto; }
  #index a { color: var(--ink); text-decoration: none; white-space: nowrap; }
  #index a small { color: var(--muted); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 36%); gap: 16px; padding: 16px; }
  #ctx { position: sticky; top: calc(var(--hdr, 90px) + 16px); align-self: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-height: calc(100vh - var(--hdr, 90px) - 32px); overflow: auto; }
  #ctx .frame { position: relative; line-height: 0; overflow: hidden; width: fit-content; margin: 0 auto; }
  #ctx img { display: block; max-width: 100%; max-height: 55vh; }
  #ctx .box { position: absolute; border: 2px solid var(--star); }
  #ctx .box.current { border: 3px solid #ffd400; box-shadow: 0 0 0 9999px #0008; z-index: 1; }
  #ctx h3 { margin: 10px 0 2px; font-size: 16px; }
  #ctx .sub { color: var(--muted); font-size: 14px; }
  #ctx h4 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; margin-bottom: 14px; scroll-margin-top: calc(var(--hdr, 90px) + 16px); }
  .group h2 { font-size: 17px; margin: 0 0 8px; }
  .group h2 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: 140px; cursor: pointer; }
  .tile canvas { display: block; width: 100%; height: 140px; background: var(--tile); }
  .tile.small canvas { height: 90px; }
  .tile .meta { padding: 4px 6px 6px 7px; font-size: 13px; display: flex; gap: 4px; align-items: flex-start; }
  .tile .meta .label { flex: 1; min-width: 0; overflow-wrap: break-word; }
  .tile .meta b { font-weight: 600; }
  .tile .meta small { color: var(--muted); font-size: 12px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .also { display: block; color: var(--star); font-size: 12px; font-weight: 600; margin-top: 2px; }
  #ctxOthers { margin-bottom: 10px; }
  .tile.festive .meta b { color: var(--festive); }
  .tile .star { flex: none; width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--star); cursor: pointer; font-size: 13px; padding: 0; }
  .tile.unstarred { opacity: .4; }
  .tile.unstarred .star { color: #9a9184; }
  .tile.current { outline: 3px solid #ffd400; }
  .tile.sibling { outline: 2px solid var(--star); }
  .empty { color: var(--muted); font-style: italic; font-size: 14px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } #ctx { position: static; order: -1; max-height: none; } }
</style>
</head>
<body>
<header id="hdr">
  <h1>Starred items</h1>
  <a href="/review">Back to review</a>
  <label>Sort groups <select id="sort"><option value="count">most items first</option><option value="name">A to Z</option></select></label>
  <input type="search" id="q" placeholder="Find item label">
  <span class="count" id="count"></span>
  <div class="help"><span>Hover or click an item to see the painting and its other starred items. <b>S</b> unstar or restar · <b>E</b> or click label to rename · <b>U</b> undo</span><span id="status"></span></div>
  <nav id="index"></nav>
</header>
<div class="layout">
  <main id="list"></main>
  <aside id="ctx">
    <h4 id="ctxOthersHead">Hover an item to see what else is starred in its painting</h4>
    <div class="tiles" id="ctxOthers"></div>
    <div class="frame" id="ctxFrame"><img id="ctxImg" alt=""></div>
    <h3 id="ctxTitle"></h3>
    <div class="sub" id="ctxSub"></div>
  </aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const isFestive = i => i.festive === "True";
const groupKey = label => label.trim().toLowerCase();
const caption = a => `${a.artist || "Unknown artist"}. ${a.title}, ${String(a.date).replace(/\.$/, "")}. The Art Institute of Chicago.`;
let byId = {}, entries = [], undoStack = [], current = null, rejectedHidden = 0;
const images = new Map();

function loadImage(id) {
  if (!images.has(id)) images.set(id, new Promise((resolve, reject) => {
    const im = new Image(); im.onload = () => resolve(im); im.onerror = reject; im.src = `/images1600/${id}.jpg`;
  }));
  return images.get(id);
}
const entryOf = key => entries.find(e => e.key === key);
const siblingsOf = e => entries.filter(o => o.a.id === e.a.id && o.key !== e.key && o.i.starred);

function tileHtml(e, small = false) {
  return `<div class="tile ${small ? "small" : ""} ${isFestive(e.i) ? "festive" : ""} ${e.i.starred ? "" : "unstarred"}" data-key="${e.key}">
    <canvas></canvas>
    <div class="meta"><span class="label" title="Click to rename (E)"><b>${esc(e.i.label)}</b><small>${esc(e.a.title)}</small>${small ? "" : alsoLine(e)}</span>
      <button class="star" title="Unstar or restar (S)">${e.i.starred ? "★" : "☆"}</button></div></div>`;
}
function alsoLine(e) {
  const sibs = siblingsOf(e);
  return `<span class="also">${sibs.length ? `★ also: ${sibs.map(o => esc(o.i.label)).join(", ")}` : ""}</span>`;
}
async function drawTile(t) {
  const e = entryOf(t.dataset.key), im = await loadImage(e.a.id), i = e.i, W = im.naturalWidth, H = im.naturalHeight;
  const bx = i.x0 * W, by = i.y0 * H, bw = (i.x1 - i.x0) * W, bh = (i.y1 - i.y0) * H, pad = 0.06 * Math.max(bw, bh);
  const sx = Math.max(0, bx - pad), sy = Math.max(0, by - pad), sw = Math.min(W, bx + bw + pad) - sx, sh = Math.min(H, by + bh + pad) - sy;
  const h = t.classList.contains("small") ? 90 : 140, w = Math.max(h * 0.85, Math.min(h * 2, Math.round(h * sw / sh))), dpr = window.devicePixelRatio || 1;
  const c = t.querySelector("canvas");
  c.width = w * dpr; c.height = h * dpr; t.style.width = w + "px";
  const g = c.getContext("2d"), scale = Math.min(c.width / sw, c.height / sh), dw = sw * scale, dh = sh * scale;
  g.drawImage(im, sx, sy, sw, sh, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
}

function groups() {
  const q = $("q").value.trim().toLowerCase(), map = new Map();
  entries.filter(e => !q || e.i.label.toLowerCase().includes(q)).forEach(e => {
    const k = groupKey(e.i.label);
    if (!map.has(k)) map.set(k, { name: e.i.label.trim(), items: [] });
    map.get(k).items.push(e);
  });
  const list = [...map.values()];
  list.forEach(g => g.items.sort((x, y) => x.a.title.localeCompare(y.a.title)));
  return $("sort").value === "name" ? list.sort((x, y) => x.name.localeCompare(y.name))
    : list.sort((x, y) => y.items.length - x.items.length || x.name.localeCompare(y.name));
}

const observer = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { observer.unobserve(e.target); drawTile(e.target); }
}), { rootMargin: "600px" });
function render() {
  observer.disconnect();
  const gs = groups();
  $("list").innerHTML = gs.length ? gs.map((g, n) => `<section class="group" id="g${n}"><h2>${esc(g.name)} <small>${g.items.length}</small></h2>
    <div class="tiles">${g.items.map(e => tileHtml(e)).join("")}</div></section>`).join("") : `<p class="empty">No starred items match.</p>`;
  $("index").innerHTML = gs.map((g, n) => `<a href="#g${n}">${esc(g.name)} <small>${g.items.length}</small></a>`).join("");
  document.querySelectorAll("#list .tile").forEach(t => observer.observe(t));
  updateCount(gs.length);
  if (current) markCurrent();
}
function updateCount(groupCount) {
  const starred = entries.filter(e => e.i.starred), works = new Set(starred.map(e => e.a.id)).size;
  $("count").textContent = `${starred.length} starred items · ${groupCount ?? document.querySelectorAll("section.group").length} kinds · ${works} works`
    + (rejectedHidden ? ` · ${rejectedHidden} in rejected works hidden` : "");
}

function showCtx(key) {
  const e = entryOf(key);
  if (!e) return;
  current = key;
  if ($("ctxImg").dataset.id !== e.a.id) { $("ctxImg").src = `/images1600/${e.a.id}.jpg`; $("ctxImg").dataset.id = e.a.id; $("ctxImg").alt = e.a.title; }
  const sibs = siblingsOf(e);
  $("ctxFrame").querySelectorAll(".box").forEach(b => b.remove());
  [...sibs, e].forEach(o => $("ctxFrame").insertAdjacentHTML("beforeend",
    `<div class="box ${o === e ? "current" : ""}" style="left:${o.i.x0 * 100}%;top:${o.i.y0 * 100}%;width:${(o.i.x1 - o.i.x0) * 100}%;height:${(o.i.y1 - o.i.y0) * 100}%"></div>`));
  $("ctxTitle").textContent = e.i.label + (isFestive(e.i) ? " (festive)" : "");
  $("ctxSub").textContent = caption(e.a);
  $("ctxOthersHead").textContent = sibs.length ? `Also starred in this painting (${sibs.length})` : "No other starred items in this painting";
  $("ctxOthers").innerHTML = sibs.map(o => tileHtml(o, true)).join("");
  $("ctxOthers").querySelectorAll(".tile").forEach(drawTile);
  markCurrent();
}
function markCurrent() {
  const e = entryOf(current), sibKeys = new Set(e ? siblingsOf(e).map(o => o.key) : []);
  document.querySelectorAll("#list .tile").forEach(t => {
    t.classList.toggle("current", t.dataset.key === current);
    t.classList.toggle("sibling", sibKeys.has(t.dataset.key));
  });
}

async function post(body) {
  const r = await fetch("/api/review/item", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { $("status").textContent = "Save failed. Is the server running?"; throw new Error("save failed"); }
}
async function setStar(key, value, remember = true) {
  const e = entryOf(key);
  await post({ keys: [key], field: "starred", value });
  e.i.starred = value;
  if (remember) undoStack.push(() => setStar(key, !value, false));
  document.querySelectorAll(`.tile[data-key="${key}"]`).forEach(t => {
    t.classList.toggle("unstarred", !value);
    t.querySelector(".star").textContent = value ? "★" : "☆";
  });
  entries.filter(o => o.a.id === e.a.id).forEach(o => document.querySelectorAll(`#list .tile[data-key="${o.key}"] .also`).forEach(el => el.outerHTML = alsoLine(o)));
  updateCount();
  if (current) showCtx(current);
  $("status").textContent = `${value ? "Restarred" : "Unstarred"} "${e.i.label}" in "${e.a.title}"`;
}
async function setLabel(key, value, remember = true) {
  const e = entryOf(key), previous = e.i.label;
  await post({ keys: [key], field: "new_label", value });
  e.i.label = value;
  if (remember) undoStack.push(() => setLabel(key, previous, false));
  render();
  if (current) showCtx(current);
  $("status").textContent = `Renamed "${previous}" to "${value}" in "${e.a.title}"`;
}
async function rename(key) {
  const e = entryOf(key), clean = (prompt(`Rename "${e.i.label}" to:`, e.i.label) || "").trim();
  if (clean && clean !== e.i.label) await setLabel(key, clean);
}
function undo() {
  const last = undoStack.pop();
  if (last) last(); else $("status").textContent = "Nothing to undo";
}

document.addEventListener("mouseover", ev => {
  const t = ev.target.closest(".tile");
  if (t && t.closest("#list") && t.dataset.key !== current) showCtx(t.dataset.key);
});
document.addEventListener("click", ev => {
  const t = ev.target.closest(".tile");
  if (!t) return;
  const key = t.dataset.key;
  if (ev.target.closest(".star")) return setStar(key, !entryOf(key).i.starred);
  if (ev.target.closest(".label")) return rename(key);
  if (t.closest("#ctxOthers")) {
    const target = document.querySelector(`#list .tile[data-key="${key}"]`);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  showCtx(key);
});
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input, select, textarea") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === "u") return undo();
  if (k === "s" && current) return setStar(current, !entryOf(current).i.starred);
  if (k === "e" && current) { ev.preventDefault(); return rename(current); }
});
["sort", "q"].forEach(id => $(id).addEventListener("input", render));
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr", $("hdr").offsetHeight + "px")).observe($("hdr"));

fetch("/api/review").then(r => r.json()).then(d => {
  d.artworks.forEach(a => {
    byId[a.id] = a;
    a.items.forEach(i => {
      ["x0", "y0", "x1", "y1"].forEach(k => i[k] = +i[k]);
      if (!i.starred || i.dropped) return;
      if (a.decision === "reject") { rejectedHidden++; return; }
      entries.push({ key: `${a.id}:${i.item_id}`, a, i });
    });
  });
  render();
});
</script>
</body>
</html>
