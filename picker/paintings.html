<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painting Sifter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>▦</text></svg>">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --reject: #a33a2a; --keep: #2f7d4a; --accent: #9a2b2b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --panel: #222126; --ink: #ecebe8; --muted: #a29d95; --line: #35333a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  h1 { font-size: 19px; margin: 0 12px 0 0; display: inline-block; }
  .stats { color: var(--muted); }
  .stats b { color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; align-items: center; }
  label { color: var(--muted); font-size: 14px; display: flex; gap: 5px; align-items: center; }
  select, input[type=search] { font: inherit; font-size: 15px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  button { font: inherit; font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.danger { background: var(--reject); border-color: var(--reject); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .g { font-size: 14px; padding: 3px 10px; border-radius: 14px; font-weight: 500; }
  .g.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .g small { opacity: .65; margin-left: 3px; }
  .help { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  main { padding: 14px 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .card.keep { box-shadow: inset 0 0 0 4px var(--keep); }
  .card.reject .thumb img { opacity: .2; filter: grayscale(1); }
  .card.reject .meta { opacity: .5; }
  .thumb { aspect-ratio: 1; background: #00000010; cursor: zoom-in; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pending { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .meta { padding: 7px 9px 4px; flex: 1; }
  .title { font-weight: 600; font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-block; font-size: 12px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); margin-top: 3px; }
  .chip.festive { color: #9a2b2b; border-color: #9a2b2b66; }
  .objs { font-size: 12.5px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px 9px 9px; }
  .acts button { padding: 6px 0; }
  .acts .k.on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .acts .r.on { background: var(--reject); border-color: var(--reject); color: #fff; }
  .score { position: absolute; top: 6px; left: 6px; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 1; box-shadow: 0 1px 3px #0005; background: #7d7770; pointer-events: none; }
  .score.s5 { background: #1f6f43; } .score.s4 { background: #4c8f3a; } .score.s3 { background: #a08a1f; } .score.s2 { background: #b0602a; } .score.s1, .score.s0 { background: #9b4a3c; }
  .badge { position: absolute; top: 6px; right: 6px; font-size: 12px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 10px; z-index: 1; pointer-events: none; }
  .badge.keep { background: var(--keep); } .badge.reject { background: var(--reject); }
  dialog { border: none; border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink); width: min(1200px, 95vw); }
  dialog::backdrop { background: #000b; }
  .big { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 1fr); }
  .big img { width: 100%; max-height: 90vh; object-fit: contain; background: #00000018; display: block; }
  .big .info { padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
  .big h2 { margin: 0; font-size: 20px; }
  .big .acts { padding: 0; }
  .nav { display: flex; justify-content: space-between; gap: 6px; }
  a { color: var(--accent); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }
  @media (max-width: 700px) { .big { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Painting sifter</h1><span class="stats" id="stats"></span>
  <div class="row" id="groups" role="group" aria-label="Groups"></div>
  <div class="row">
    <input type="search" id="q" placeholder="Search title, artist, objects…" aria-label="Search">
    <label>Show <select id="show"><option value="undecided">undecided</option><option value="all">all</option><option value="keep">kept</option><option value="reject">rejected</option></select></label>
    <label>Min object score <select id="minScore"><option value="">any</option><option>5</option><option>4</option><option>3</option><option>2</option></select></label>
    <label><input type="checkbox" id="hidePeople" checked> hide people-only and sketches</label>
    <label>Place <select id="place"><option value="">any</option></select></label>
    <label>Century <select id="century"><option value="">any</option></select></label>
    <label><input type="checkbox" id="boosted"> AIC highlights only</label>
    <label>Sort <select id="sort"><option value="score">object score</option><option value="group">group, then date</option><option value="date">date</option><option value="title">title</option><option value="artist">artist</option></select></label>
  </div>
  <div class="row">
    <button class="danger" id="rejectShown">Reject all undecided shown</button>
    <button id="undo" disabled>Undo last action</button>
  </div>
  <div class="help">Each painting starts <b>undecided</b>. Press <b>Keep</b> or <b>Reject</b> (press again to undo). With Show set to "undecided", decided paintings disappear so you can work through the list. Click a picture to see it larger: there, <b>K</b> keeps, <b>R</b> rejects, <b>U</b> clears, ← → move.</div>
</header>
<main id="grid"></main>
<dialog id="dlg" aria-label="Painting"><div class="big"><img id="bImg" alt=""><div class="info">
  <div class="nav"><button id="bPrev">← Prev</button><button id="bClose">Close (Esc)</button><button id="bNext">Next →</button></div>
  <h2 id="bTitle">Painting</h2><div id="bSub" class="sub"></div>
  <div class="acts"><button class="k" id="bKeep">Keep (K)</button><button class="r" id="bReject">Reject (R)</button></div>
  <div id="bTags" class="help"></div>
  <a id="bLink" target="_blank" rel="noopener">See it on artic.edu ↗</a>
</div></div></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let all = [], shown = [], activeGroups = new Set(), history = [], current = -1, frozen = null;
const century = p => /^-?\d+$/.test(p.date_end) ? Math.floor(+p.date_end / 100) + 1 : null;
const img = p => `/images/${p.id}.jpg`;

async function load() {
  all = (await (await fetch("/api/paintings")).json()).paintings;
  const places = Object.entries(all.reduce((m, p) => (m[p.place || "?"] = (m[p.place || "?"] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  $("place").innerHTML = '<option value="">any</option>' + places.map(([k, n]) => `<option value="${esc(k)}">${esc(k)} (${n})</option>`).join("");
  const cs = [...new Set(all.map(century).filter(c => c != null))].sort((a, b) => a - b);
  $("century").innerHTML = '<option value="">any</option>' + cs.map(c => `<option value="${c}">${c < 1 ? `${1 - c} BCE` : `${c}th century`}</option>`).join("");
  render();
}

function passes(p, ignoreGroup) {
  const q = $("q").value.trim().toLowerCase(), show = $("show").value;
  if (!ignoreGroup && activeGroups.size && !activeGroups.has(p.group)) return false;
  if (show === "undecided" && p.decision && !(frozen && frozen.has(p.id))) return false;
  if (show === "keep" && p.decision !== "keep") return false;
  if (show === "reject" && p.decision !== "reject") return false;
  if ($("minScore").value && (p.score == null || p.score < +$("minScore").value)) return false;
  if ($("hidePeople").checked && (p.people_only === "True" || p.finish === "sketch")) return false;
  if ($("place").value && (p.place || "?") !== $("place").value) return false;
  if ($("century").value && String(century(p)) !== $("century").value) return false;
  if ($("boosted").checked && p.boosted !== "True") return false;
  if (q && !`${p.title} ${p.artist} ${p.subjects} ${p.place} ${p.items}`.toLowerCase().includes(q)) return false;
  return true;
}

function render() {
  shown = all.filter(p => passes(p, false));
  const order = ["everyday scenes and interiors", "town and buildings", "water and boats", "animals", "still life", "landscape", "myth and history", "untagged"];
  const by = {
    score: (a, b) => (b.score ?? -1) - (a.score ?? -1) || (+b.detail_items || 0) - (+a.detail_items || 0),
    group: (a, b) => order.indexOf(a.group) - order.indexOf(b.group) || (+a.date_end || 0) - (+b.date_end || 0),
    date: (a, b) => (+a.date_end || 0) - (+b.date_end || 0),
    title: (a, b) => a.title.localeCompare(b.title),
    artist: (a, b) => a.artist.localeCompare(b.artist),
  }[$("sort").value];
  shown.sort(by);
  const base = all.filter(p => passes(p, true));
  const counts = base.reduce((m, p) => (m[p.group] = (m[p.group] || 0) + 1, m), {});
  $("groups").innerHTML = `<button class="g ${activeGroups.size ? "" : "on"}" data-g="">All groups<small>${base.length}</small></button>` +
    Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(g => `<button class="g ${activeGroups.has(g) ? "on" : ""}" data-g="${esc(g)}">${esc(g)}<small>${counts[g]}</small></button>`).join("");
  const n = d => all.filter(p => p.decision === d).length;
  $("stats").innerHTML = `${shown.length} shown · <b>${n("keep")} kept</b> · ${n("reject")} rejected · ${all.length - n("keep") - n("reject")} undecided`;
  $("rejectShown").textContent = `Reject all undecided shown (${shown.filter(p => !p.decision).length})`;
  $("grid").innerHTML = shown.length ? shown.map((p, i) => `
    <div class="card ${p.decision}" data-i="${i}">
      ${p.score != null ? `<div class="score s${p.score}">${p.score}</div>` : ""}
      ${p.decision ? `<div class="badge ${p.decision}">${p.decision === "keep" ? "kept" : "rejected"}</div>` : ""}
      <div class="thumb" data-open="${i}" tabindex="0" role="button" aria-label="Show ${esc(p.title)} larger"><img loading="lazy" src="${img(p)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'pending', textContent: 'no image'}))"></div>
      <div class="meta"><div class="title">${esc(p.title)}</div><div class="sub">${esc(p.artist || "Unknown")} · ${esc(p.date)}</div>
        <span class="chip">${esc(p.group)}</span>${p.festive ? ` <span class="chip festive">festive</span>` : ""}
        ${p.items ? `<div class="objs">${esc(p.items.replace(/ \((detail|main subject)(, unclear)?\)/g, ""))}</div>` : ""}</div>
      <div class="acts"><button class="k ${p.decision === "keep" ? "on" : ""}" data-act="keep" data-i="${i}">Keep</button><button class="r ${p.decision === "reject" ? "on" : ""}" data-act="reject" data-i="${i}">Reject</button></div>
    </div>`).join("") : '<div class="empty">Nothing to show.</div>';
}

async function setDecision(list, decision, record = true) {
  const changed = list.filter(p => p.decision !== decision);
  if (!changed.length) return;
  if (record) { history.push(changed.map(p => [p, p.decision])); $("undo").disabled = false; }
  changed.forEach(p => p.decision = decision);
  await fetch("/api/paintings/decision", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ids: changed.map(p => p.id), decision})});
}

async function decideOnCard(p, decision) {
  await setDecision([p], p.decision === decision ? "" : decision);
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

$("grid").addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) { decideOnCard(shown[+act.dataset.i], act.dataset.act); return; }
  const o = e.target.closest("[data-open]");
  if (o) openBig(+o.dataset.open);
});
$("grid").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.open) openBig(+e.target.dataset.open); });
$("groups").addEventListener("click", e => {
  const b = e.target.closest("[data-g]");
  if (!b) return;
  const g = b.dataset.g;
  if (!g) activeGroups.clear();
  else if (e.metaKey || e.ctrlKey || e.shiftKey) activeGroups.has(g) ? activeGroups.delete(g) : activeGroups.add(g);
  else activeGroups = activeGroups.size === 1 && activeGroups.has(g) ? new Set() : new Set([g]);
  render();
});
$("rejectShown").onclick = async () => {
  const list = shown.filter(p => !p.decision);
  if (list.length && confirm(`Reject all ${list.length} undecided paintings shown?`)) { await setDecision(list, "reject"); render(); }
};
$("undo").onclick = async () => {
  const last = history.pop();
  if (!last) return;
  for (const val of [...new Set(last.map(([, d]) => d))]) await setDecision(last.filter(([, d]) => d === val).map(([p]) => p), val, false);
  $("undo").disabled = !history.length;
  render();
};

function openBig(i) {
  if (i < 0 || i >= shown.length) return;
  current = i;
  const p = shown[i];
  frozen = frozen || new Set(shown.map(x => x.id));
  $("bImg").src = img(p); $("bImg").alt = p.title;
  $("bTitle").textContent = p.title;
  $("bSub").textContent = `${p.artist || "Unknown"} · ${p.date} · ${p.place}`;
  $("bKeep").classList.toggle("on", p.decision === "keep");
  $("bReject").classList.toggle("on", p.decision === "reject");
  $("bTags").innerHTML = [
    p.score != null ? `<b>Object score ${p.score}</b>${p.note ? ": " + esc(p.note) : ""}` : "",
    p.items ? `<b>Objects:</b> ${esc(p.items)}` : "",
    p.festive ? `<b>Festive:</b> ${esc(p.festive)}` : "",
    `<b>Group:</b> ${esc(p.group)}${p.subjects ? " · " + esc(p.subjects) : ""}`,
  ].filter(Boolean).join("<br><br>");
  $("bLink").href = `https://www.artic.edu/artworks/${p.id}`;
  if (!$("dlg").open) $("dlg").showModal();
}
async function decideBig(decision) {
  const p = shown[current];
  if (!p) return;
  await setDecision([p], decision === "" ? "" : (p.decision === decision ? "" : decision));
  openBig(current);
}
$("bKeep").onclick = () => decideBig("keep");
$("bReject").onclick = () => decideBig("reject");
$("bPrev").onclick = () => openBig(current - 1);
$("bNext").onclick = () => openBig(current + 1);
$("bClose").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
$("dlg").addEventListener("close", () => { frozen = null; const y = window.scrollY; render(); window.scrollTo(0, y); });
document.addEventListener("keydown", e => {
  if (!$("dlg").open || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright") openBig(current + 1);
  else if (k === "arrowleft") openBig(current - 1);
  else if (k === "k") decideBig("keep");
  else if (k === "r") decideBig("reject");
  else if (k === "u") decideBig("");
});
["q", "show", "minScore", "hidePeople", "place", "century", "boosted", "sort"].forEach(id => $(id).addEventListener("input", render));
load();
</script>
</body>
</html>
