<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Description Test</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>¶</text></svg>">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --hl: #fde68a; --hl-star: #f5b301; --miss: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --panel: #222126; --ink: #ecebe8; --muted: #a29d95; --line: #35333a; --hl: #6b5a12; --hl-star: #a87a00; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  h1 { font-size: 19px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  .help { font-size: 13.5px; color: var(--muted); flex-basis: 100%; }
  .help mark { padding: 0 3px; border-radius: 3px; background: var(--hl); color: inherit; }
  .help mark.star { background: var(--hl-star); }
  main { padding: 16px; max-width: 1500px; margin: 0 auto; }
  .work { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 20px; display: grid; grid-template-columns: minmax(260px, 30%) 1fr 1fr; gap: 18px; }
  .work h2 { font-size: 18px; margin: 10px 0 2px; }
  .work .cap { color: var(--muted); font-size: 13.5px; }
  .frame { position: relative; line-height: 0; }
  .frame img { width: 100%; display: block; border-radius: 4px; }
  .frame .box { position: absolute; border: 3px solid #ffd400; box-shadow: 0 0 0 9999px #0009; display: none; }
  .col h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
  .col p { margin: 0 0 10px; }
  .col mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; cursor: default; }
  .col mark.star { background: var(--hl-star); }
  .stats { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  .stats b { color: var(--ink); }
  .missing { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .missing span { color: var(--miss); }
  .missing span.star { font-weight: 700; }
  @media (max-width: 1000px) { .work { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Description test</h1>
  <a href="/starred">Starred items</a>
  <a href="/review">Review</a>
  <div class="help">Left: written with accessibility guidelines only. Right: same guidelines plus the detected items. <mark>Highlighted</mark> words match an item label exactly, as the app would; <mark class="star">gold</mark> ones are starred items. Hover a highlight to see the item in the painting.</div>
</header>
<main id="list"></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const caption = a => `${a.artist || "Unknown artist"}. ${a.title}, ${String(a.date).replace(/\.$/, "")}. The Art Institute of Chicago.`;

function parse(md) {
  const out = [];
  md.split(/^## /m).slice(1).forEach(block => {
    const [head, ...rest] = block.split("\n");
    const m = head.match(/^(.*) \((.*), [^,]*\)\s*$/);
    out.push({ title: m[1].trim(), artist: m[2].trim(), text: rest.join("\n").trim() });
  });
  return out;
}

function labelPattern(label) {
  const words = label.trim().toLowerCase().split(/\s+/).map(reEsc);
  words[words.length - 1] += "(?:s|es)?";
  return new RegExp(`\\b${words.join("\\s+")}\\b`, "gi");
}

function highlight(text, items) {
  const spans = [];
  items.forEach(i => {
    for (const m of text.matchAll(labelPattern(i.label))) spans.push({ start: m.index, end: m.index + m[0].length, item: i });
  });
  spans.sort((x, y) => x.start - y.start || (y.end - y.start) - (x.end - x.start));
  const kept = [], found = new Set();
  let pos = 0;
  spans.forEach(s => { if (s.start >= pos) { kept.push(s); pos = s.end; } });
  spans.forEach(s => found.add(s.item.item_id));
  let html = "", last = 0;
  kept.forEach(s => {
    html += esc(text.slice(last, s.start)) + `<mark class="${s.item.starred ? "star" : ""}" data-item="${s.item.item_id}" title="${esc(s.item.label)}">${esc(text.slice(s.start, s.end))}</mark>`;
    last = s.end;
  });
  html += esc(text.slice(last));
  return { html, found };
}

function column(name, text, items) {
  if (!text) return `<div class="col"><h3>${name}</h3><p class="missing">No description.</p></div>`;
  const { html, found } = highlight(text, items), words = text.split(/\s+/).length;
  const starred = items.filter(i => i.starred), missing = items.filter(i => !found.has(i.item_id));
  return `<div class="col"><h3>${name}</h3><p>${html}</p>
    <div class="stats"><b>${words}</b> words · <b>${items.length - missing.length}</b> of ${items.length} items named · <b>${starred.filter(i => found.has(i.item_id)).length}</b> of ${starred.length} starred</div>
    ${missing.length ? `<div class="missing">Not named: ${missing.map(i => `<span class="${i.starred ? "star" : ""}">${esc(i.label)}${i.starred ? " ★" : ""}</span>`).join(", ")}</div>` : ""}</div>`;
}

Promise.all([fetch("/api/review").then(r => r.json()), fetch("/descriptions/test_a11y.md").then(r => r.text()), fetch("/descriptions/test_objects.md").then(r => r.text())])
  .then(([d, a11y, objects]) => {
    const A = parse(a11y), B = parse(objects);
    const find = (list, w) => list.find(x => x.title === w.title && x.artist === w.artist);
    const surname = s => s.trim().split(/\s+/).pop();
    const works = A.map(w => ({ w, art: d.artworks.find(a => a.title === w.title && a.artist.includes(surname(w.artist))) })).filter(x => x.art);
    $("list").innerHTML = works.map(({ w, art }) => {
      const items = art.items.filter(i => !i.dropped);
      items.forEach(i => ["x0", "y0", "x1", "y1"].forEach(k => i[k] = +i[k]));
      art._items = items;
      return `<section class="work" data-id="${art.id}">
        <div><div class="frame"><img src="/images1600/${art.id}.jpg" alt="${esc(art.title)}"><div class="box"></div></div>
          <h2>${esc(art.title)}</h2><div class="cap">${esc(caption(art))}</div></div>
        ${column("A · Accessibility only", w.text, items)}
        ${column("B · Accessibility + objects", (find(B, w) || {}).text, items)}</section>`;
    }).join("");
    window._works = Object.fromEntries(works.map(x => [x.art.id, x.art]));
  });

$("list").addEventListener("mouseover", e => {
  const mark = e.target.closest("mark"), sec = e.target.closest("section.work");
  if (!sec) return;
  const box = sec.querySelector(".box");
  if (!mark) { box.style.display = "none"; return; }
  const i = window._works[sec.dataset.id]._items.find(x => x.item_id === mark.dataset.item);
  Object.assign(box.style, { display: "block", left: i.x0 * 100 + "%", top: i.y0 * 100 + "%", width: (i.x1 - i.x0) * 100 + "%", height: (i.y1 - i.y0) * 100 + "%" });
});
</script>
</body>
</html>
