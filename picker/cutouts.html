<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutout Review</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>✂</text></svg>">
<style>
  :root { --bg: #f6f4ef; --panel: #fff; --ink: #1f1d1a; --muted: #6b665e; --line: #e2ddd3; --flag: #c0392b; --ok: #2e8b57; --redo: #d4860b; --crop: #4a6fa5; --stage: #3c5a48; --star: #d4a017; --tile: #2a2724; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --panel: #222126; --ink: #ecebe8; --muted: #a29d95; --line: #35333a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  h1 { font-size: 19px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  header label { font-size: 14px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  header select, header input[type=search] { font: inherit; font-size: 14px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
  .count { margin-left: auto; font-size: 14px; color: var(--muted); }
  .help { font-size: 13px; color: var(--muted); flex-basis: 100%; display: flex; gap: 16px; flex-wrap: wrap; }
  #status { color: var(--ink); }
  main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card.v-ok { border-left-color: var(--ok); }
  .card.v-redo { border-left-color: var(--redo); }
  .card.v-crop { border-left-color: var(--crop); }
  .card.starred { border-color: var(--star); box-shadow: 0 0 0 1px var(--star); }
  .meta .starmark { color: var(--star); font-weight: 700; margin-right: 3px; }
  .card.sel { outline: 3px solid #ffd400; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--line); }
  .pair > div { height: 200px; display: flex; align-items: center; justify-content: center; position: relative; }
  .pair .crop { background: var(--tile); }
  .pair .cut { background: var(--stage); }
  .pair canvas, .pair img { max-width: 94%; max-height: 94%; display: block; }
  .pair span { position: absolute; top: 4px; left: 6px; font-size: 11px; color: #fffc; text-shadow: 0 1px 2px #000; }
  .meta { padding: 7px 10px 9px; font-size: 13.5px; }
  .meta b { font-size: 15px; }
  .meta .detail { color: var(--muted); }
  .meta .title { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .flag { color: var(--flag); font-weight: 600; display: block; }
  .meta .prompt { color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 6px; margin-top: 7px; }
  .actions button { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); cursor: pointer; }
  .actions button.on[data-v=ok] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .actions button.on[data-v=redo] { background: var(--redo); border-color: var(--redo); color: #fff; }
  .actions button.on[data-v=crop] { background: var(--crop); border-color: var(--crop); color: #fff; }
  .note { width: 100%; margin-top: 7px; font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); resize: vertical; min-height: 30px; }
  .note.has { border-color: var(--redo); }
  .empty { color: var(--muted); font-style: italic; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>Cutout review</h1>
  <a href="/review">Back to review</a>
  <label>Show <select id="show">
    <option value="flagged">flagged</option>
    <option value="todo">flagged, not yet judged</option>
    <option value="all">all cutouts</option>
    <option value="redo">marked redo</option>
    <option value="crop">marked use crop</option>
    <option value="ok">marked OK</option>
    <option value="note">with a comment</option>
  </select></label>
  <label>Sort <select id="sort"><option value="flag">flag type</option><option value="group">label A to Z</option><option value="cover">box cover, lowest first</option></select></label>
  <input type="search" id="q" placeholder="Search label or title">
  <span class="count" id="count"></span>
  <div class="help"><span>Click a card or use ← → to select. <b>O</b> OK, <b>R</b> redo, <b>C</b> use the crop instead, <b>0</b> clear, <b>U</b> undo. Judging moves to the next card. Type a comment for me in the box under a card; it saves when you click away.</span><span id="status"></span></div>
</header>
<main id="grid"></main>
<script>
const $ = id => document.getElementById(id);
const VERDICTS = { ok: "OK", redo: "Redo", crop: "Use crop" };
let cutouts = [], shown = [], sel = -1;
const history = [], images = {};

function loadImage(id) {
  return images[id] ??= new Promise((resolve, reject) => {
    const im = new Image(); im.onload = () => resolve(im); im.onerror = reject; im.src = `/images1600/${id}.jpg`;
  });
}

async function drawCrop(canvas, c) {
  if (!c.box) return;
  const im = await loadImage(c.id);
  const [x0, y0, x1, y1] = c.box.map((v, i) => v * (i % 2 ? im.naturalHeight : im.naturalWidth));
  const pad = 0.15 * Math.max(x1 - x0, y1 - y0);
  const sx = Math.max(0, x0 - pad), sy = Math.max(0, y0 - pad);
  const sw = Math.min(im.naturalWidth, x1 + pad) - sx, sh = Math.min(im.naturalHeight, y1 + pad) - sy;
  const scale = Math.min(400 / sw, 400 / sh);
  canvas.width = Math.max(1, Math.round(sw * scale)); canvas.height = Math.max(1, Math.round(sh * scale));
  const g = canvas.getContext("2d");
  g.drawImage(im, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  g.strokeStyle = "#ffd400cc"; g.lineWidth = 2; g.setLineDash([6, 4]);
  g.strokeRect((x0 - sx) * scale, (y0 - sy) * scale, (x1 - x0) * scale, (y1 - y0) * scale);
}

function flagRank(c) { return c.flag.includes("edge") && c.flag.includes("little") ? 0 : c.flag.includes("edge") ? 1 : c.flag ? 2 : 3; }

function filtered() {
  const show = $("show").value, q = $("q").value.trim().toLowerCase();
  let list = cutouts.filter(c =>
    show === "all" ? true : show === "flagged" ? c.flag : show === "todo" ? c.flag && !c.verdict : show === "note" ? c.note : c.verdict === show);
  if (q) list = list.filter(c => `${c.group} ${c.detail} ${c.title} ${c.note}`.toLowerCase().includes(q));
  const sort = $("sort").value;
  const by = sort === "group" ? (a, b) => a.group.localeCompare(b.group)
    : sort === "cover" ? (a, b) => a.box_cover - b.box_cover
    : (a, b) => flagRank(a) - flagRank(b) || a.group.localeCompare(b.group);
  return list.sort((a, b) => b.starred - a.starred || by(a, b));
}

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]); }

function cardHtml(c, n) {
  const detail = c.detail.toLowerCase() !== c.group.toLowerCase() ? ` <span class="detail">(${esc(c.detail)})</span>` : "";
  return `<div class="card v-${c.verdict}${c.starred ? " starred" : ""}" data-n="${n}">
    <div class="pair"><div class="crop"><span>detected box</span><canvas></canvas></div>
      <div class="cut"><span>cutout</span><img loading="lazy" src="/cutout/${c.id}_${c.item_id}.png" alt="Cutout of ${esc(c.group)}"></div></div>
    <div class="meta">${c.starred ? `<span class="starmark" title="Starred">★</span>` : ""}<b>${esc(c.group)}</b>${detail}
      <span class="title">${esc(c.title)}</span>
      ${c.flag ? `<span class="flag">${esc(c.flag)}</span>` : ""}
      <span class="prompt">prompt "${esc(c.prompt)}", box cover ${c.box_cover}${c.margin === "0.4" ? ", wider margin" : ""}</span>
      <div class="actions">${Object.entries(VERDICTS).map(([v, l]) =>
        `<button data-v="${v}" class="${c.verdict === v ? "on" : ""}">${l}</button>`).join("")}</div>
      <textarea class="note${c.note ? " has" : ""}" rows="1" placeholder="Comment for Claude">${esc(c.note)}</textarea>
    </div></div>`;
}

const observer = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  observer.unobserve(e.target);
  drawCrop(e.target.querySelector("canvas"), shown[+e.target.dataset.n]);
}), { rootMargin: "400px" });

function render() {
  shown = filtered();
  sel = Math.min(sel, shown.length - 1);
  $("grid").innerHTML = shown.length ? shown.map(cardHtml).join("") : `<p class="empty">Nothing to show.</p>`;
  $("grid").querySelectorAll(".card").forEach(el => observer.observe(el));
  markSel(false);
  updateCount();
}

function updateCount() {
  const flagged = cutouts.filter(c => c.flag);
  const judged = flagged.filter(c => c.verdict).length;
  const notes = cutouts.filter(c => c.note).length;
  const tally = Object.keys(VERDICTS).map(v => `${cutouts.filter(c => c.verdict === v).length} ${VERDICTS[v].toLowerCase()}`).join(", ");
  const stars = shown.filter(c => c.starred).length;
  $("count").textContent = `showing ${shown.length} (${stars} starred) · ${judged} of ${flagged.length} flagged judged · ${tally} · ${notes} with comments`;
}

function markSel(scroll = true) {
  document.querySelectorAll(".card.sel").forEach(el => el.classList.remove("sel"));
  const el = document.querySelector(`.card[data-n="${sel}"]`);
  if (!el) return;
  el.classList.add("sel");
  if (scroll) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function setVerdict(c, verdict, remember = true) {
  const before = c.verdict;
  const r = await fetch("/api/cutouts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keys: [c.key], field: "verdict", value: verdict }) });
  if (!r.ok) { $("status").textContent = "Save failed"; return; }
  c.verdict = verdict;
  if (remember) history.push({ c, before });
  const n = shown.indexOf(c), el = document.querySelector(`.card[data-n="${n}"]`);
  if (el) {
    el.className = `card v-${verdict}${c.starred ? " starred" : ""}${n === sel ? " sel" : ""}`;
    el.querySelectorAll(".actions button").forEach(b => b.classList.toggle("on", b.dataset.v === verdict));
  }
  $("status").textContent = verdict ? `${c.group}: ${VERDICTS[verdict]}` : `${c.group}: cleared`;
  updateCount();
}

$("grid").addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  sel = +card.dataset.n; markSel(false);
  const b = e.target.closest("button[data-v]");
  if (b) { const c = shown[sel]; setVerdict(c, c.verdict === b.dataset.v ? "" : b.dataset.v); }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "arrowright" || k === "arrowleft") {
    e.preventDefault();
    sel = Math.max(0, Math.min(shown.length - 1, sel + (k === "arrowright" ? 1 : -1))); markSel();
  } else if (k === "u") {
    const last = history.pop();
    if (last) setVerdict(last.c, last.before, false);
  } else if (sel >= 0 && ({ o: "ok", r: "redo", c: "crop", 0: "" })[k] !== undefined) {
    setVerdict(shown[sel], ({ o: "ok", r: "redo", c: "crop", 0: "" })[k]);
    if (sel < shown.length - 1) { sel++; markSel(); }
  }
});

$("grid").addEventListener("change", async e => {
  if (!e.target.matches(".note")) return;
  const c = shown[+e.target.closest(".card").dataset.n], note = e.target.value.trim();
  const r = await fetch("/api/cutouts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keys: [c.key], field: "note", value: note }) });
  if (!r.ok) { $("status").textContent = "Comment not saved"; return; }
  c.note = note;
  e.target.classList.toggle("has", !!note);
  $("status").textContent = note ? `${c.group}: comment saved` : `${c.group}: comment removed`;
  updateCount();
});

["show", "sort"].forEach(id => $(id).addEventListener("change", render));
$("q").addEventListener("input", render);

fetch("/api/cutouts").then(r => r.json()).then(d => { cutouts = d.cutouts; sel = 0; render(); });
</script>
</body>
</html>
